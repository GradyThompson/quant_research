[project]
name = "quant-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gradythompson", email = "grady_thompson@outlook.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=2.0.0",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
]

[project.scripts]
quant-research = "quant_research:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.13",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

markers = [
    "slow: computationally expensive tests",
    "external: tests requiring external services",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
]

[tool.mypy]
python_version = "3.13"
